[project]
name = "copenhagen-student-jobs"
version = "0.1.0"
description = "A living picture of the student job market in Greater Copenhagen."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["beautifulsoup4>=4.12"]

[project.scripts]
cphjobs = "cphjobs.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cphjobs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: Update

on:
  schedule:
    - cron: "0 5 * * *" # every day, 07:00 in Copenhagen (summer time)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "pyproject.toml", "uv.lock", ".github/workflows/**"]

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  fetch:
    # Code pushes only rebuild the page; the data is collected on schedule or by hand.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Collect postings
        id: collect
        # A source that fails should not throw away what the other one collected.
        run: uv run cphjobs fetch --export data/export || echo "partial=true" >> "$GITHUB_OUTPUT"
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update data $(TZ=Europe/Copenhagen date +%F)"
            git push
          fi
      - name: Report partial collection
        if: steps.collect.outputs.partial == 'true'
        run: |
          echo "::error::At least one source failed. See the Collect postings step."
          exit 1

  site:
    needs: fetch
    # Publish even when fetch was skipped (code push) or one source failed (its data is still committed).
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # includes the data commit from the fetch job
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run cphjobs site --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
